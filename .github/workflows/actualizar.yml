name: Actualización diaria

# Cada mañana deja constancia en el repositorio; ese commit hace que Cloudflare Pages
# reconstruya la web, que descarga los turnos del día y de los 9 días siguientes.
on:
  schedule:
    # todos los días a las 09:50 en Madrid en invierno (10:50 en verano), después del cambio de turno de las 9:30
    - cron: '50 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Registrar la actualización
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > pipeline/ultima_actualizacion.txt
          git config user.name "turno-bot"
          git config user.email "turno-bot@users.noreply.github.com"
          git add pipeline/ultima_actualizacion.txt
          git commit -m "Actualización diaria de guardias"
          git push
