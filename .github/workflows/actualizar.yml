name: Actualizar guardias

# Cloudflare Pages reconstruye la web (y descarga los datos del día) en cada push.
# Este job lo dispara además dos veces al día mediante un deploy hook.
on:
  schedule:
    # 09:50 en Madrid en invierno (10:50 en verano), después del cambio de turno de las 9:30
    - cron: '50 8 * * *'
    # refresco de tarde para recoger cambios de última hora
    - cron: '30 17 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  disparar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir a Cloudflare una nueva versión
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          test -n "$HOOK" || { echo "Falta el secreto CF_DEPLOY_HOOK"; exit 1; }
          curl -fsS -X POST "$HOOK"
